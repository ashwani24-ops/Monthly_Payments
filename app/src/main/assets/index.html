<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payments</title>
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6578; --line:#D6DCE5;
  --paid:#1E7F5C; --paid-soft:#E2F2EB; --due:#B7790F; --due-soft:#FBF1DC; --late:#B3261E; --late-soft:#FBE4E2;
  --year:#3F51B5; --year-soft:#E6E9F8;
  --accent:#14213D; --on-accent:#FFFFFF; --shadow:0 1px 2px rgba(20,33,61,.08);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --surface:#172034; --ink:#E8ECF4; --muted:#9AA5BA; --line:#2A3550;
    --paid:#4FC08D; --paid-soft:#173A2E; --due:#E5A93A; --due-soft:#3A2F17; --late:#F07A70; --late-soft:#3D1D1D;
    --year:#9FA8F0; --year-soft:#232B52;
    --accent:#E8ECF4; --on-accent:#0E1524; --shadow:none; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--due);outline-offset:2px}

.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 16px}
.month h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.month .yr{display:block;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.nav{display:flex;gap:6px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.icon-btn:disabled{opacity:.35;cursor:default}

.meter{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.meter-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.count{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.count small{font-size:20px;color:var(--muted);font-weight:600}
.meter-note{color:var(--muted);font-size:14px;text-align:right}
.bar{display:flex;gap:4px;margin-top:14px}
.bar span{flex:1;height:10px;border-radius:3px;background:var(--line)}
.bar span.on{background:var(--paid)}
.sums{display:flex;justify-content:space-between;margin-top:12px;font-size:14px;color:var(--muted)}
.sums b{color:var(--ink);font-weight:700}

.banner{background:var(--due-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.notice{background:var(--late-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.notice button{flex:none;border:0;background:var(--late);color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:14px;border-left:5px solid var(--line)}
.item.paid{border-left-color:var(--paid)}
.item.late{border-left-color:var(--late)}
.item.soon{border-left-color:var(--due)}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
.item.paid .check{background:var(--paid);border-color:var(--paid);color:var(--surface)}
.check svg{width:18px;height:18px;opacity:0}
.item.paid .check svg{opacity:1}
.body{flex:1;min-width:0}
.name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.item.paid .name{color:var(--muted)}
.meta{font-size:13.5px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.meta svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px}
.tag.paid{background:var(--paid-soft);color:var(--paid)}
.tag.late{background:var(--late-soft);color:var(--late)}
.tag.soon{background:var(--due-soft);color:var(--due)}
.tag.year{background:var(--year-soft);color:var(--year)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.more{flex:none;width:36px;height:36px;border:0;background:transparent;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.more svg{width:20px;height:20px}

.section-title{font-size:15px;font-weight:700;margin:28px 0 10px;color:var(--muted)}
.yrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left}
.yrow .ydate{flex:none;width:46px;text-align:center;border-radius:8px;background:var(--year-soft);color:var(--year);padding:4px 0;line-height:1.1}
.yrow .ydate b{display:block;font-size:17px}
.yrow .ydate span{font-size:11.5px;font-weight:700}
.yrow .yname{flex:1;min-width:0;font-weight:600}
.yrow .yname small{display:block;color:var(--muted);font-weight:400;font-size:13px}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(20px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(20,33,61,.25)}
.fab svg{width:20px;height:20px}

.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);display:none;z-index:20}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .22s ease}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h2{margin:0 0 14px;font-size:20px}
.field{margin-bottom:14px}
.field label,.field .lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 12px}
textarea{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px/1.4 monospace;padding:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{height:42px;border:0;border-radius:8px;background:transparent;font-weight:600;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);outline:1px solid var(--line)}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;min-height:50px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:700;padding:0 14px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.good{background:var(--paid);color:#fff;border-color:var(--paid)}
.btn.danger{color:var(--late);border-color:var(--late)}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{text-align:left}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.switch-row b{display:block}
.switch-row small{color:var(--muted);font-size:13px}
.switch{flex:none;position:relative;width:52px;height:30px;border-radius:15px;border:0;background:var(--line);padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--paid)}
.switch[aria-checked="true"]::after{left:25px}
.divider{height:1px;background:var(--line);margin:16px 0}
.status{font-size:14px;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.status.ok{background:var(--paid-soft);color:var(--paid)}
.status.bad{background:var(--late-soft);color:var(--late)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:30;gap:14px;align-items:center;max-width:90vw}
.toast.show{display:flex}
.toast button{background:transparent;border:0;color:var(--due);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="month">
    <h1 id="monthTitle">—</h1>
    <div class="nav">
      <button class="icon-btn" id="prevBtn" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="icon-btn" id="nextBtn" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <div id="notifNotice"></div>
  <section class="meter" id="meter"></section>
  <div class="banner" id="viewBanner" hidden></div>
  <ul class="list" id="list"></ul>
  <div id="yearly"></div>
</div>

<button class="fab" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add item</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function(){
  const LS_KEY = "monthly-payments-v1";
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const REMIND_OPTS = [[-1,"No reminder"],[0,"On the due day"],[1,"1 day before"],[2,"2 days before"],[3,"3 days before"],[5,"5 days before"],[7,"1 week before"]];
  const BELL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`;
  const $ = id => document.getElementById(id);
  const A = window.Android || null;
  const pad = n => String(n).padStart(2,"0");
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  const currentKey = () => monthKey(new Date());
  const keyToDate = k => { const [y,m]=k.split("-").map(Number); return new Date(y,m-1,1); };
  const shiftKey = (k,n) => { const d=keyToDate(k); d.setMonth(d.getMonth()+n); return monthKey(d); };
  const monthOf = k => Number(k.split("-")[1]);
  const daysIn = k => { const d=keyToDate(k); return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); };
  const fmtMoney = v => (v!=="" && v!=null && !isNaN(v)) ? "₹" + Number(v).toLocaleString("en-IN",{maximumFractionDigits:2}) : "";
  const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.split("-").map(Number); return `${d} ${MONTHS[m-1].slice(0,3)}`; };
  const ordinal = n => { const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
  const uid = () => Math.random().toString(36).slice(2,10);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const remindLabel = r => (REMIND_OPTS.find(o=>o[0]===r)||[0,""])[1];

  let state = { items:[], months:{}, settings:{remindersOn:true, time:"09:00"} };
  let viewKey = currentKey();

  function normalise(s){
    const out = { items: Array.isArray(s.items) ? s.items : [], months: s.months || {}, settings: Object.assign({remindersOn:true, time:"09:00"}, s.settings||{}) };
    out.items.forEach(it => {
      if(!it.freq) it.freq = "monthly";
      if(it.remind === undefined || it.remind === "") it.remind = it.dueDay ? 1 : -1;
    });
    return out;
  }
  function loadLocal(){ try { const raw = localStorage.getItem(LS_KEY); if(raw) state = normalise(JSON.parse(raw)); } catch(e){} }
  function save(){
    const json = JSON.stringify(state);
    try { localStorage.setItem(LS_KEY, json); } catch(e){}
    if(A && A.syncData) try { A.syncData(json); } catch(e){}
  }

  const applies = (it,k) => (!it.created || it.created <= k) && (it.freq !== "yearly" || Number(it.dueMonth) === monthOf(k));
  const dueDayIn = (it,k) => it.dueDay ? Math.min(Number(it.dueDay), daysIn(k)) : 0;
  const itemsFor = k => state.items.filter(it => applies(it,k))
      .sort((a,b)=>(dueDayIn(a,k)||99)-(dueDayIn(b,k)||99) || a.name.localeCompare(b.name));
  const paidMap = k => state.months[k] || {};

  function status(it, k){
    const p = paidMap(k)[it.id];
    if(p) return {cls:"paid", label:`Paid ${fmtDate(p)}`};
    const dd = dueDayIn(it,k), cur = currentKey();
    if(k < cur) return {cls:"late", label:"Not paid"};
    if(!dd || k > cur) return {cls:"", label:""};
    const d = new Date().getDate();
    if(d > dd) return {cls:"late", label:`Overdue by ${d-dd} day${d-dd>1?"s":""}`};
    if(dd === d) return {cls:"soon", label:"Due today"};
    if(dd - d <= 3) return {cls:"soon", label:`Due in ${dd-d} day${dd-d>1?"s":""}`};
    return {cls:"", label:""};
  }

  function notifOk(){ try { return !A || A.notificationsAllowed(); } catch(e){ return true; } }

  function render(){
    const d = keyToDate(viewKey);
    $("monthTitle").innerHTML = `${MONTHS[d.getMonth()]}<span class="yr">${d.getFullYear()}</span>`;
    $("nextBtn").disabled = viewKey >= shiftKey(currentKey(), 12);

    const wantsReminders = state.settings.remindersOn && state.items.some(i=>i.remind>=0);
    $("notifNotice").innerHTML = (A && wantsReminders && !notifOk())
      ? `<div class="notice"><span>Notifications are off, so reminders can’t appear.</span><button id="allowNotif">Turn on</button></div>` : "";
    if($("allowNotif")) $("allowNotif").onclick = () => A.requestNotifications();

    const items = itemsFor(viewKey), pm = paidMap(viewKey);
    const paidCount = items.filter(i=>pm[i.id]).length;
    const total = items.reduce((s,i)=>s+(Number(i.amount)||0),0);
    const paidAmt = items.filter(i=>pm[i.id]).reduce((s,i)=>s+(Number(i.amount)||0),0);
    const left = items.length - paidCount;

    $("meter").innerHTML = items.length ? `
      <div class="meter-top">
        <div class="count">${paidCount}<small> of ${items.length} paid</small></div>
        <div class="meter-note">${left===0 ? "All done for the month" : `${left} still to pay`}</div>
      </div>
      <div class="bar" aria-hidden="true">${items.map(i=>`<span class="${pm[i.id]?"on":""}"></span>`).join("")}</div>
      ${total ? `<div class="sums"><span>Paid <b>${fmtMoney(paidAmt)}</b></span><span>Remaining <b>${fmtMoney(total-paidAmt)}</b></span></div>` : ""}
    ` : `<div class="count">0<small> due this month</small></div>`;

    const banner = $("viewBanner");
    if(viewKey < currentKey()){ banner.hidden=false; banner.textContent = "You’re viewing a past month. Changes here update that month’s record only."; }
    else if(viewKey > currentKey()){ banner.hidden=false; banner.textContent = "Upcoming month. Mark anything you’ve paid in advance."; }
    else banner.hidden = true;

    const list = $("list");
    if(!state.items.length){
      list.innerHTML = `<li class="empty"><strong>Add your payments</strong>Monthly ones like rent, electricity and SIP reset to unpaid on the 1st. Yearly ones like insurance or school fees show up in their due month.</li>`;
    } else if(!items.length){
      list.innerHTML = `<li class="empty">Nothing due in this month.</li>`;
    } else {
      list.innerHTML = items.map(it => {
        const st = status(it, viewKey), dd = dueDayIn(it, viewKey);
        const metaBits = [];
        if(dd) metaBits.push(`<span>Due on ${ordinal(dd)}</span>`);
        if(it.remind >= 0 && state.settings.remindersOn) metaBits.push(`<span>${BELL}${it.remind===0?"On due day":it.remind+"d before"}</span>`);
        if(it.note) metaBits.push(`<span>${esc(it.note)}</span>`);
        const tags = [it.freq==="yearly" ? `<span class="tag year">Yearly</span>` : "", st.label ? `<span class="tag ${st.cls}">${st.label}</span>` : ""].join("");
        return `<li class="item ${st.cls}" data-id="${it.id}">
          <button class="check" data-act="toggle" aria-label="${pm[it.id] ? "Mark unpaid" : "Mark paid"}: ${esc(it.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
          <div class="body" data-act="toggle">
            <div class="name">${esc(it.name)}</div>
            ${metaBits.length ? `<div class="meta">${metaBits.join("")}</div>` : ""}
            ${tags.trim() ? `<div class="tags">${tags}</div>` : ""}
          </div>
          ${it.amount ? `<div class="amt">${fmtMoney(it.amount)}</div>` : ""}
          <button class="more" data-act="menu" aria-label="Options for ${esc(it.name)}"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
        </li>`;
      }).join("");
    }

    // Yearly items due in other months, in order of their next due month
    const vm = monthOf(viewKey);
    const others = state.items.filter(it => it.freq==="yearly" && Number(it.dueMonth)!==vm)
      .map(it => ({it, gap:(Number(it.dueMonth)-vm+12)%12}))
      .sort((a,b)=>a.gap-b.gap);
    $("yearly").innerHTML = others.length ? `<div class="section-title">Other yearly payments</div><div class="menu-list">${others.map(({it,gap}) => `
      <button class="yrow" data-yid="${it.id}" data-gap="${gap}">
        <span class="ydate"><b>${it.dueDay||"–"}</b><span>${MONTHS[it.dueMonth-1].slice(0,3)}</span></span>
        <span class="yname">${esc(it.name)}<small>Opens ${MONTHS[it.dueMonth-1]}</small></span>
        ${it.amount ? `<span class="amt">${fmtMoney(it.amount)}</span>` : ""}
      </button>`).join("")}</div>` : "";
  }

  // Sheets
  function openSheet(html){ $("sheet").innerHTML = html; $("sheet").classList.add("open"); $("scrim").classList.add("open"); $("sheet").scrollTop = 0; }
  function closeSheet(){ $("sheet").classList.remove("open"); $("scrim").classList.remove("open"); }
  $("scrim").onclick = closeSheet;

  function markPaidSheet(it){
    const existing = paidMap(viewKey)[it.id];
    const end = `${viewKey}-${pad(daysIn(viewKey))}`, t = today();
    const def = existing || (t <= end ? t : end);
    openSheet(`<h2>${existing ? "Change paid date" : "Mark as paid"}</h2>
      <div class="field"><label for="pDate">${esc(it.name)} paid on</label><input type="date" id="pDate" value="${def}" max="${t}"></div>
      <div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn good" id="ok">Mark paid</button></div>`);
    $("cancel").onclick = closeSheet;
    $("ok").onclick = () => {
      state.months[viewKey] = Object.assign({}, paidMap(viewKey), {[it.id]: $("pDate").value || t});
      save(); render(); closeSheet();
    };
  }

  function unmark(it){
    const prev = paidMap(viewKey)[it.id], k = viewKey;
    const m = Object.assign({}, paidMap(k)); delete m[it.id]; state.months[k] = m;
    save(); render();
    showToast(`${it.name} marked unpaid`, () => { state.months[k] = Object.assign({}, paidMap(k), {[it.id]:prev}); save(); render(); });
  }

  function itemForm(it){
    const isNew = !it;
    let freq = it ? it.freq : "monthly";
    const remindDefault = it ? it.remind : 1;
    const dm = it && it.dueMonth ? Number(it.dueMonth) : monthOf(viewKey);
    openSheet(`<h2>${isNew ? "Add item" : "Edit item"}</h2>
      <div class="field"><label for="fName">Name</label><input id="fName" placeholder="e.g. Electricity bill" value="${it?esc(it.name):""}" maxlength="60"></div>
      <div class="field"><span class="lbl" id="freqLbl">Repeats</span>
        <div class="seg" role="radiogroup" aria-labelledby="freqLbl">
          <button role="radio" data-f="monthly">Every month</button><button role="radio" data-f="yearly">Every year</button>
        </div></div>
      <div class="field" id="monthField"><label for="fMonth">Due month</label>
        <select id="fMonth">${MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1===dm?"selected":""}>${m}</option>`).join("")}</select></div>
      <div class="row2">
        <div class="field"><label for="fDue">Due day</label><input id="fDue" type="number" inputmode="numeric" min="1" max="31" placeholder="1–31" value="${it&&it.dueDay?it.dueDay:""}"></div>
        <div class="field"><label for="fAmt">Amount (₹)</label><input id="fAmt" type="number" inputmode="decimal" min="0" placeholder="Optional" value="${it&&it.amount?it.amount:""}"></div>
      </div>
      <div class="field"><label for="fRemind">Reminder</label>
        <select id="fRemind">${REMIND_OPTS.map(([v,l])=>`<option value="${v}" ${v===remindDefault?"selected":""}>${l}</option>`).join("")}</select></div>
      <p class="hint" id="remindHint">Reminds you daily at ${state.settings.time} from this day until it’s marked paid.</p>
      <div class="field"><label for="fNote">Note</label><input id="fNote" placeholder="Optional, e.g. HDFC autopay" value="${it&&it.note?esc(it.note):""}" maxlength="80"></div>
      <div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="ok">${isNew ? "Add item" : "Save changes"}</button></div>`);
    const setFreq = f => { freq = f; document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-checked", b.dataset.f===f)); $("monthField").hidden = f!=="yearly"; };
    document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setFreq(b.dataset.f));
    setFreq(freq);
    const hint = () => { $("remindHint").hidden = Number($("fRemind").value) < 0; };
    $("fRemind").onchange = hint; hint();
    $("cancel").onclick = closeSheet;
    $("ok").onclick = () => {
      const name = $("fName").value.trim();
      if(!name){ $("fName").focus(); $("fName").placeholder = "Enter a name to continue"; return; }
      const amount = $("fAmt").value === "" ? "" : Math.max(0, Number($("fAmt").value));
      let due = parseInt($("fDue").value,10); due = due>=1 && due<=31 ? due : "";
      const remind = Number($("fRemind").value);
      if(remind >= 0 && !due){ $("fDue").value=""; $("fDue").placeholder = "Needed"; $("fDue").focus(); $("remindHint").hidden=false; $("remindHint").textContent = "Add a due day so the reminder knows when to start."; return; }
      const note = $("fNote").value.trim();
      const fields = {name, amount, dueDay:due, note, remind, freq, dueMonth: freq==="yearly" ? Number($("fMonth").value) : ""};
      if(isNew){
        // A yearly item starts from its next due month, so past months don't show it as unpaid
        const cur = keyToDate(currentKey()), dmo = Number($("fMonth").value);
        const created = freq==="yearly" ? `${cur.getFullYear() + (dmo < cur.getMonth()+1 ? 1 : 0)}-${pad(dmo)}` : viewKey;
        state.items.push(Object.assign({id:uid(), created}, fields));
      } else Object.assign(it, fields);
      save(); closeSheet();
      if(remind >= 0 && A && !notifOk() && !state.settings.askedNotif){ state.settings.askedNotif = true; save(); A.requestNotifications(); }
      render();
    };
    if(isNew) setTimeout(()=>$("fName").focus(),150);
  }

  function menuSheet(it){
    const inView = applies(it, viewKey);
    const paid = inView && paidMap(viewKey)[it.id];
    openSheet(`<h2>${esc(it.name)}</h2>
      <div class="menu-list">
        ${inView ? (paid ? `<button class="btn" id="mDate">Change paid date</button><button class="btn" id="mUnpay">Mark unpaid</button>` : `<button class="btn" id="mDate">Mark paid on a date</button>`) : ""}
        <button class="btn" id="mEdit">Edit item</button>
        <button class="btn danger" id="mDel">Delete item</button>
        <button class="btn" id="cancel">Close</button>
      </div>`);
    $("cancel").onclick = closeSheet;
    if($("mDate")) $("mDate").onclick = () => markPaidSheet(it);
    if($("mUnpay")) $("mUnpay").onclick = () => { closeSheet(); unmark(it); };
    $("mEdit").onclick = () => itemForm(it);
    $("mDel").onclick = () => {
      openSheet(`<h2>Delete ${esc(it.name)}?</h2><p class="hint" style="margin:0 0 16px">It will be removed from every month, including past payment records, and its reminders will stop.</p>
        <div class="actions"><button class="btn" id="cancel">Keep it</button><button class="btn danger" id="ok">Delete item</button></div>`);
      $("cancel").onclick = closeSheet;
      $("ok").onclick = () => {
        state.items = state.items.filter(x=>x.id!==it.id);
        for(const k in state.months){ if(state.months[k][it.id]){ const m=Object.assign({},state.months[k]); delete m[it.id]; state.months[k]=m; } }
        save(); render(); closeSheet();
      };
    };
  }

  function settingsSheet(){
    const s = state.settings;
    const permLine = !A ? "" : (notifOk()
      ? `<div class="status ok">Notifications are allowed for this app.</div>`
      : `<div class="status bad">Notifications are blocked. <button class="linklike btn" id="sAllow" style="min-height:40px;margin-top:8px;width:100%">Allow notifications</button></div>`);
    openSheet(`<h2>Settings</h2>
      <div class="switch-row"><div><b>Payment reminders</b><small>A daily notification for anything due soon or overdue</small></div>
        <button class="switch" id="sOn" role="switch" aria-checked="${s.remindersOn}" aria-label="Payment reminders"></button></div>
      <div id="sMore" ${s.remindersOn?"":"hidden"}>
        <div class="field"><label for="sTime">Reminder time</label><input type="time" id="sTime" value="${s.time}"></div>
        ${permLine}
        ${A ? `<button class="btn" id="sTest" style="width:100%">Send a test notification</button>` : ""}
        <p class="hint" style="margin-top:10px">Each item has its own reminder setting. If reminders don’t show up, set this app’s battery usage to “Unrestricted” in Android settings.</p>
      </div>
      <div class="divider"></div>
      <div class="menu-list"><button class="btn" id="sBackup">Back up or restore data</button><button class="btn" id="cancel">Done</button></div>`);
    $("cancel").onclick = closeSheet;
    $("sOn").onclick = () => {
      s.remindersOn = !s.remindersOn; save(); render();
      $("sOn").setAttribute("aria-checked", s.remindersOn); $("sMore").hidden = !s.remindersOn;
      if(s.remindersOn && A && !notifOk()) A.requestNotifications();
    };
    $("sTime").onchange = e => { if(e.target.value){ s.time = e.target.value; save(); render(); } };
    if($("sAllow")) $("sAllow").onclick = () => A.requestNotifications();
    if($("sTest")) $("sTest").onclick = () => { if(!notifOk()) return A.requestNotifications(); A.testNotification(); };
    $("sBackup").onclick = backupSheet;
  }

  function backupSheet(){
    openSheet(`<h2>Back up or restore</h2>
      <p class="hint" style="margin:0 0 14px">Your data lives only on this phone. Save a backup now and then, and before uninstalling the app.</p>
      <div class="menu-list"><button class="btn primary" id="bExport">Save backup (share to Drive, WhatsApp, email)</button></div>
      <div class="field" style="margin-top:18px"><label for="bText">Restore: paste a backup here</label><textarea id="bText" placeholder="Paste backup text"></textarea></div>
      <div class="actions"><button class="btn" id="cancel">Close</button><button class="btn good" id="bImport">Restore backup</button></div>`);
    $("cancel").onclick = closeSheet;
    $("bExport").onclick = () => {
      const text = JSON.stringify({app:"monthly-payments", version:2, savedAt:today(), ...state});
      if(A && A.share) A.share(text);
      else if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>showToast("Backup copied", null));
    };
    $("bImport").onclick = () => {
      try {
        const d = JSON.parse($("bText").value.trim());
        if(!d || !Array.isArray(d.items)) throw 0;
        state = normalise(d); save(); render(); closeSheet();
        showToast(`Restored ${d.items.length} items`, null);
      } catch(e){ $("bText").value = ""; $("bText").placeholder = "That text isn’t a valid backup. Paste the full backup text and try again."; }
    };
  }

  // Interactions
  $("list").addEventListener("click", e => {
    const act = e.target.closest("[data-act]"); if(!act) return;
    const li = e.target.closest(".item"); const it = state.items.find(x=>x.id===li.dataset.id); if(!it) return;
    if(act.dataset.act === "menu") return menuSheet(it);
    if(paidMap(viewKey)[it.id]) return unmark(it);
    if(viewKey < currentKey()) return markPaidSheet(it);
    const k = viewKey;
    state.months[k] = Object.assign({}, paidMap(k), {[it.id]: today()});
    save(); render();
    showToast(`${it.name} paid today`, () => { const m=Object.assign({},paidMap(k)); delete m[it.id]; state.months[k]=m; save(); render(); });
  });
  $("yearly").addEventListener("click", e => {
    const b = e.target.closest(".yrow"); if(!b) return;
    const it = state.items.find(x=>x.id===b.dataset.yid); if(!it) return;
    const target = shiftKey(viewKey, Number(b.dataset.gap));
    const max = shiftKey(currentKey(), 12);
    if(target <= max){ viewKey = target; render(); window.scrollTo(0,0); } else menuSheet(it);
  });

  let toastTimer;
  function showToast(msg, undo){
    $("toastMsg").textContent = msg; $("toast").classList.add("show");
    $("toastUndo").hidden = !undo;
    $("toastUndo").onclick = () => { if(undo) undo(); $("toast").classList.remove("show"); };
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>$("toast").classList.remove("show"), 4000);
  }

  $("addBtn").onclick = () => itemForm(null);
  $("settingsBtn").onclick = settingsSheet;
  $("prevBtn").onclick = () => { viewKey = shiftKey(viewKey,-1); render(); };
  $("nextBtn").onclick = () => { if(viewKey < shiftKey(currentKey(),12)){ viewKey = shiftKey(viewKey,1); render(); } };

  let lastKey = currentKey();
  function checkRollover(){ const k=currentKey(); if(k!==lastKey){ if(viewKey===lastKey) viewKey=k; lastKey=k; } render(); }
  document.addEventListener("visibilitychange", () => { if(!document.hidden) checkRollover(); });
  setInterval(checkRollover, 60000);

  // Called by Android when the app comes back to the screen or a permission answer arrives
  window.onAppResume = () => { checkRollover(); if($("sheet").classList.contains("open") && $("sOn")) settingsSheet(); };
  window.handleBack = () => {
    if($("sheet").classList.contains("open")){ closeSheet(); return true; }
    if(viewKey !== currentKey()){ viewKey = currentKey(); render(); return true; }
    return false;
  };

  loadLocal(); save(); render();
})();
</script>
</body>
</html>
